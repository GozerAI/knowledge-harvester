services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: harvester-postgres
    environment:
      POSTGRES_DB: ${PG_DATABASE:-workflow_library}
      POSTGRES_USER: ${PG_USER:-harvester}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-harvester_dev_password}
    volumes:
      - harvester-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PG_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-harvester} -d ${PG_DATABASE:-workflow_library}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: harvester-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - tools

volumes:
  harvester-pgdata:
